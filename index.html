<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin | Rivi Silva</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f4f5; }
        .gold-bg { background: linear-gradient(135deg, #f09f0a 0%, #a67c00 100%); }
        .gold-text { color: #f09f0a; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #f09f0a; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useCallback } = React;
        const h = React.createElement;

        const supabaseUrl = 'https://rahubkowehwtvditbhlx.supabase.co';
        const supabaseKey = 'sb_publishable_wKbs4gYVURdIR6Cafm8qFA_tUZZTIKo'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const MESES = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        const LoginPortal = ({ onLogin }) => {
            const [pass, setPass] = useState("");
            const handleLogin = () => pass === "1234" ? onLogin() : alert("Senha Incorreta");
            return h("div", { className: "min-h-screen flex items-center justify-center bg-black p-4" },
                h("div", { className: "bg-[#111] p-10 rounded-[2.5rem] border border-[#f09f0a]/20 w-full max-w-md text-center shadow-2xl" },
                    h("div", { className: "mb-6 flex justify-center" },
                        h("div", { className: "w-20 h-20 rounded-full bg-[#f09f0a] flex items-center justify-center shadow-[0_0_30px_rgba(240,159,10,0.3)] text-black font-black text-2xl" }, "🛡️")
                    ),
                    h("h2", { className: "text-[#f09f0a] font-black italic uppercase text-3xl mb-2 tracking-tighter" }, "Rivi Silva"),
                    h("input", { 
                        type: "password", 
                        placeholder: "DIGITE A SENHA", 
                        className: "w-full p-5 bg-zinc-900 border border-zinc-800 rounded-2xl text-white text-center mb-6 outline-none focus:border-[#f09f0a]", 
                        value: pass, 
                        onChange: (e) => setPass(e.target.value), 
                        onKeyPress: (e) => e.key === 'Enter' && handleLogin() 
                    }),
                    h("button", { onClick: handleLogin, className: "w-full py-5 gold-bg text-black font-black uppercase text-xs tracking-widest rounded-2xl" }, "Entrar")
                )
            );
        };

        function Dashboard() {
            const [isAuth, setIsAuth] = useState(false);
            const [currentTab, setCurrentTab] = useState("agendamentos");
            const [loading, setLoading] = useState(true);
            const [clientes, setClientes] = useState([]);
            const [searchTerm, setSearchTerm] = useState("");
            const [filterDate, setFilterDate] = useState(new Date().toISOString().split('T')[0]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [servicosDb, setServicosDb] = useState([]);
            const [servicosSelecionados, setServicosSelecionados] = useState([]);
            const [novoAgendamento, setNovoAgendamento] = useState({ nome: "", telefone: "", data: new Date().toISOString().split('T')[0], horario: "08:00", aniversario: "" });
            const [viewDate, setViewDate] = useState(new Date());
            const [bloqueios, setBloqueios] = useState([]);
            const [mesesLiberados, setMesesLiberados] = useState([]);
            const [excecoes, setExcecoes] = useState({});
            const [config, setConfig] = useState({ inicio: '09:00', fim: '18:00', intervalo: 40 });
            const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
            const [selectedDateISO, setSelectedDateISO] = useState(null);
            const [tempInicio, setTempInicio] = useState('');
            const [tempFim, setTempFim] = useState('');
            const [horariosInativadosMap, setHorariosInativadosMap] = useState({});

            const [agendamentosManicure, setAgendamentosManicure] = useState([]);
            const [loadingManicure, setLoadingManicure] = useState(false);
            const [servicosSelecionadosIds, setServicosSelecionadosIds] = useState([]);
            
            const hojeObj = new Date();
            const primeiroDiaMes = new Date(hojeObj.getFullYear(), hojeObj.getMonth(), 1).toISOString().split('T')[0];
            const dataHojeStr = hojeObj.toISOString().split('T')[0];

            const [dataInicioManicure, setDataInicioManicure] = useState(primeiroDiaMes);
            const [dataFimManicure, setDataFimManicure] = useState(dataHojeStr);

            const [lancamentosFinanceiros, setLancamentosFinanceiros] = useState([]);
            const [loadingFinanceiro, setLoadingFinanceiro] = useState(false);
            const [isFinanceiroModalOpen, setIsFinanceiroModalOpen] = useState(false);
            const [filtroMesFin, setFiltroMesFin] = useState(hojeObj.getMonth() + 1);
            const [filtroAnoFin, setFiltroAnoFin] = useState(hojeObj.getFullYear());
            const [formDataFinanceiro, setFormDataFinanceiro] = useState({ item: "", categoria: "", valor: "", tipo: "entrada" });

            const aplicarMascaraAniversario = (v) => {
                if (!v) return "";
                v = v.replace(/\D/g, "");
                if (v.length > 4) v = v.substring(0, 4);
                if (v.length > 2) {
                    v = v.substring(0, 2) + "/" + v.substring(2);
                }
                return v;
            };

            const fetchAgendaConfigData = useCallback(async () => {
                try {
                    setLoading(true);
                    const { data: bData } = await _supabase.from('agenda_bloqueada').select('data_interditada');
                    if (bData) setBloqueios(bData.map(item => item.data_interditada));

                    const { data: mData } = await _supabase.from('meses_liberados').select('mes_ano, liberado');
                    if (mData) {
                        setMesesLiberados(mData.filter(m => m.liberado === true).map(m => m.mes_ano));
                    }

                    const { data: cData } = await _supabase.from('agenda_config').select('*').eq('id', 1).maybeSingle();
                    if (cData) {
                        setConfig({ 
                            inicio: (cData.hora_inicio || '09:00').slice(0, 5), 
                            fim: (cData.hora_fim || '18:00').slice(0, 5), 
                            intervalo: cData.intervalo_minutos || 40 
                        });
                    }

                    const { data: eData } = await _supabase.from('agenda_excecoes').select('*');
                    if (eData) {
                        const map = {};
                        eData.forEach(ex => {
                            if (ex.hora_inicio && ex.hora_fim) {
                                map[ex.data] = { 
                                    inicio: ex.hora_inicio.slice(0, 5), 
                                    fim: ex.hora_fim.slice(0, 5) 
                                };
                            }
                        });
                        setExcecoes(map);
                    }

                    const { data: hInativadosData } = await _supabase.from('horarios_bloqueados_pontuais').select('*');
                    if (hInativadosData) {
                        const hMap = {};
                        hInativadosData.forEach(item => {
                            if (!hMap[item.data]) hMap[item.data] = [];
                            hMap[item.data].push(item.horario.slice(0, 5));
                        });
                        setHorariosInativadosMap(hMap);
                    }
                } catch (err) { 
                    console.error("Erro geral da agenda:", err);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                if (isAuth) {
                    fetchData();
                    fetchServicos();
                    fetchAgendaConfigData();
                    fetchFinanceiroData();
                }
            }, [isAuth, filterDate, fetchAgendaConfigData]);

            async function fetchServicos() {
                const { data } = await _supabase.from("servicos").select("*").order("nome");
                if (data) setServicosDb(data);
            }

            async function fetchData() {
                setLoading(true);
                const { data, error } = await _supabase.from("agendamentos").select("*").eq("data_atendimento", filterDate).order("horario", { ascending: true });
                if (!error) setClientes(data || []);
                setLoading(false);
            }

            async function fetchFinanceiroData() {
                setLoadingFinanceiro(true);
                const { data, error } = await _supabase.from("financeiro").select("*").order("data", { ascending: false });
                if (!error) setLancamentosFinanceiros(data || []);
                setLoadingFinanceiro(false);
            }

            async function updateStatus(id, campo, valor) {
                const { error } = await _supabase.from("agendamentos").update({ [campo]: valor }).eq("id", id);
                if (!error) fetchData();
            }

            async function deleteAgendamento(id) {
                if(confirm("Deseja realmente excluir este agendamento?")) {
                    const { error } = await _supabase.from("agendamentos").delete().eq("id", id);
                    if (!error) fetchData();
                }
            }

            const toggleServico = (servico) => {
                const isSelected = servicosSelecionados.some(s => s.nome === servico.nome);
                if (isSelected) setServicosSelecionados(servicosSelecionados.filter(s => s.nome !== servico.nome));
                else setServicosSelecionados([...servicosSelecionados, servico]);
            };

            const totalValorNovo = servicosSelecionados.reduce((acc, s) => acc + (Number(s.preco) || 0), 0);

            const handleAddAgendamento = async () => {
                if (!novoAgendamento.nome || servicosSelecionados.length === 0) return alert("Preencha o nome e selecione um serviço!");
                if (novoAgendamento.aniversario && novoAgendamento.aniversario.length < 5) return alert("Insira o aniversário completo (DD/MM) ou deixe em branco!");
                
                const payload = { 
                    cliente_nome: novoAgendamento.nome.toUpperCase(), 
                    telefone: novoAgendamento.telefone, 
                    data_atendimento: novoAgendamento.data, 
                    horario: novoAgendamento.horario, 
                    servico: servicosSelecionados.map(s => s.nome).join(", "), 
                    valor: totalValorNovo, 
                    status: "Aguardando", 
                    presenca: "Pendente",
                    aniversario: novoAgendamento.aniversario.length === 5 ? novoAgendamento.aniversario : null
                };

                const { error } = await _supabase.from("agendamentos").insert([payload]);
                if (!error) { 
                    setIsModalOpen(false); 
                    setServicosSelecionados([]); 
                    setNovoAgendamento({ ...novoAgendamento, nome: "", telefone: "", aniversario: "" }); 
                    fetchData();
                }
            };

            const calcularPagamentoManicure = async () => {
                if (!dataInicioManicure || !dataFimManicure) {
                    alert("Selecione a data de início e término!");
                    return;
                }
                if (servicosSelecionadosIds.length === 0) {
                    alert("Selecione pelo menos um serviço para calcular!");
                    return;
                }

                setLoadingManicure(true);
                const { data, error } = await _supabase
                    .from("agendamentos")
                    .select("*")
                    .gte("data_atendimento", dataInicioManicure)
                    .lte("data_atendimento", dataFimManicure)
                    .order("data_atendimento", { ascending: false });

                if (!error) {
                    setAgendamentosManicure(data || []);
                } else {
                    alert("Erro ao buscar dados: " + error.message);
                }
                setLoadingManicure(false);
            };

            const toggleServicoManicure = (id) => {
                setServicosSelecionadosIds(prev => 
                    prev.includes(id) ? prev.filter(sId => sId !== id) : [...prev, id]
                );
            };

            const selecionarTodosManicure = () => {
                setServicosSelecionadosIds((servicosDb || []).map(s => s.id));
            };

            const limparSelecaoManicure = () => {
                setServicosSelecionadosIds([]);
            };

            const agendamentosFiltradosManicure = (agendamentosManicure || []).filter(item => {
                const servicosMarcados = (servicosDb || []).filter(s => servicosSelecionadosIds.includes(s.id));
                const batePorId = item.servico_id && servicosSelecionadosIds.includes(item.servico_id);
                const batePorNome = !item.servico_id && item.servico && servicosMarcados.some(
                    s => s.nome && item.servico && s.nome.trim().toLowerCase() === item.servico.trim().toLowerCase()
                );
                return Boolean(batePorId || batePorNome);
            });

            const valorTotalPagamentoManicure = agendamentosFiltradosManicure.reduce((acc, item) => acc + Number(item.valor || 0), 0);

            const handleSaveFinanceiro = async (e) => {
                e.preventDefault();
                const valorNumerico = parseFloat(String(formDataFinanceiro.valor).replace(",", ".")) || 0;
                const payload = {
                    item: formDataFinanceiro.item.toUpperCase(),
                    servico: formDataFinanceiro.item.toUpperCase(),
                    categoria: formDataFinanceiro.categoria.toUpperCase(),
                    valor: valorNumerico,
                    tipo: formDataFinanceiro.tipo,
                    data: new Date().toISOString().split('T')[0],
                    status: "pago"
                };

                const { error } = await _supabase.from("financeiro").insert([payload]);
                if (!error) {
                    setIsFinanceiroModalOpen(false);
                    setFormDataFinanceiro({ item: "", categoria: "", valor: "", tipo: "entrada" });
                    fetchFinanceiroData();
                } else {
                    alert("Erro ao salvar lançamento financeiro.");
                }
            };

            const lancamentosFiltradosFin = (lancamentosFinanceiros || []).filter(l => {
                if (!l.data) return false;
                const partes = l.data.split('-');
                if (partes.length < 2) return false;
                const [ano, mes] = partes;
                return Number(mes) === filtroMesFin && Number(ano) === filtroAnoFin;
            });

            const totalEntradasFin = lancamentosFiltradosFin
                .filter(l => l.tipo === "entrada")
                .reduce((acc, l) => acc + (Number(l.valor) || 0), 0);

            const totalSaidasFin = lancamentosFiltradosFin
                .filter(l => l.tipo === "saida")
                .reduce((acc, l) => acc + (Number(l.valor) || 0), 0);

            const lucroRealFin = totalEntradasFin - totalSaidasFin;

            const abrirConfigModal = (dateISO) => {
                setSelectedDateISO(dateISO);
                const confAtiva = excecoes[dateISO] || config;
                setTempInicio(confAtiva.inicio);
                setTempFim(confAtiva.fim);
                setIsConfigModalOpen(true);
            };

            const salvarExcecao = async () => {
                if (!selectedDateISO) return;
                setLoading(true);
                
                const { error } = await _supabase.from('agenda_excecoes').upsert({
                    data: selectedDateISO,
                    hora_inicio: tempInicio,
                    hora_fim: tempFim
                }, { onConflict: 'data' });

                if (!error) {
                    setExcecoes(prev => ({ ...prev, [selectedDateISO]: { inicio: tempInicio, fim: tempFim } }));
                    alert("Expediente salvo com sucesso!");
                } else {
                    console.error(error);
                    alert("Erro ao salvar horário especial.");
                }
                setLoading(false);
            };

            const toggleHorarioPontual = async (horarioStr) => {
                if (!selectedDateISO) return;
                const inativadosAtuais = horariosInativadosMap[selectedDateISO] || [];
                const jaInativado = inativadosAtuais.includes(horarioStr);

                if (jaInativado) {
                    const { error } = await _supabase.from('horarios_bloqueados_pontuais')
                        .delete()
                        .match({ data: selectedDateISO, horario: horarioStr });
                    
                    if (!error) {
                        setHorariosInativadosMap(prev => ({
                            ...prev,
                            [selectedDateISO]: inativadosAtuais.filter(h => h !== horarioStr)
                        }));
                    }
                } else {
                    const { error } = await _supabase.from('horarios_bloqueados_pontuais')
                        .insert([{ data: selectedDateISO, horario: horarioStr }]);
                    
                    if (!error) {
                        setHorariosInativadosMap(prev => ({
                            ...prev,
                            [selectedDateISO]: [...inativadosAtuais, horarioStr]
                        }));
                    }
                }
            };

            const gerarSlotsDoDia = () => {
                if (!selectedDateISO) return [];
                const confAtiva = excecoes[selectedDateISO] || config;
                const [hIni, mIni] = (confAtiva.inicio || '09:00').split(':').map(Number);
                const [hFim, mFim] = (confAtiva.fim || '18:00').split(':').map(Number);
                
                let minutosAtuais = hIni * 60 + mIni;
                const minutosFim = hFim * 60 + mFim;
                const intervalo = Number(config.intervalo) || 40;

                const slots = [];
                while (minutosAtuais < minutosFim) {
                    const hh = String(Math.floor(minutosAtuais / 60)).padStart(2, '0');
                    const mm = String(minutosAtuais % 60).padStart(2, '0');
                    slots.push(`${hh}:${mm}`);
                    minutosAtuais += intervalo;
                }
                return slots;
            };

            const toggleBloqueioDiaModal = async () => {
                if (!selectedDateISO) return;
                const jaBloqueado = bloqueios.includes(selectedDateISO);
                if (jaBloqueado) {
                    setBloqueios(prev => prev.filter(d => d !== selectedDateISO));
                    await _supabase.from('agenda_bloqueada').delete().eq('data_interditada', selectedDateISO);
                } else {
                    setBloqueios(prev => [...prev, selectedDateISO]);
                    await _supabase.from('agenda_bloqueada').insert([{ data_interditada: selectedDateISO }]);
                }
            };

            const renderMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const mesAnoKey = `${year}-${String(month + 1).padStart(2, '0')}`;
                const isLiberado = mesesLiberados.includes(mesAnoKey);
                const days = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                const monthName = date.toLocaleString('pt-BR', { month: 'long' });

                return h("div", { key: mesAnoKey, className: `bg-white p-6 rounded-[2.5rem] border-2 shadow-sm flex-1 transition-all ${isLiberado ? 'border-[#f09f0a]/30' : 'border-zinc-100 opacity-80'}` },
                    h("div", { className: "flex justify-between items-center mb-6 border-b border-zinc-100 pb-4" },
                        h("h3", { className: "font-black text-zinc-900 uppercase tracking-[0.2em] text-sm" }, `${monthName} ${year}`),
                        h("button", {
                            disabled: loading,
                            onClick: async () => {
                                const novoStatus = !isLiberado;
                                setMesesLiberados(prev => novoStatus ? [...prev, mesAnoKey] : prev.filter(m => m !== mesAnoKey));
                                const { error } = await _supabase.from('meses_liberados').upsert(
                                    { mes_ano: mesAnoKey, liberado: novoStatus },
                                    { onConflict: 'mes_ano' }
                                );
                                if (error) { console.error(error); fetchAgendaConfigData(); }
                            },
                            className: `flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-black uppercase shadow-sm transition-all ${isLiberado ? 'bg-[#f09f0a] text-black' : 'bg-zinc-200 text-zinc-500'}`
                        }, isLiberado ? '🔓 Aberto' : '🔒 Trancado')
                    ),
                    h("div", { className: "grid grid-cols-7 gap-1 text-center mb-4 text-[10px] font-bold text-zinc-400" },
                        ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map((d, i) => h("div", { key: i }, d))
                    ),
                    h("div", { className: `grid grid-cols-7 gap-3 ${!isLiberado ? 'pointer-events-none grayscale' : ''}` },
                        Array(firstDay).fill(null).map((_, i) => h("div", { key: `empty-${i}` })),
                        Array.from({ length: days }).map((_, i) => {
                            const dia = i + 1;
                            const dataISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                            const isBlocked = bloqueios.includes(dataISO);
                            const temExcecao = Boolean(excecoes[dataISO] || (horariosInativadosMap[dataISO] && horariosInativadosMap[dataISO].length > 0));

                            return h("div", {
                                key: dia,
                                onDoubleClick: () => abrirConfigModal(dataISO),
                                title: "Dê duplo clique para configurar horários do dia",
                                className: `h-12 rounded-2xl flex flex-col items-center justify-center text-sm font-bold transition-all border-2 relative cursor-pointer select-none
                                    ${isBlocked ? 'bg-red-500 text-white border-red-600 shadow-lg' : 
                                    temExcecao ? 'bg-amber-50 text-[#f09f0a] border-[#f09f0a]' : 
                                    'bg-zinc-50 text-zinc-900 border-zinc-100 hover:border-[#f09f0a]'}`
                            }, dia, temExcecao && !isBlocked && h("div", { className: "absolute -top-1 -right-1 w-3 h-3 bg-[#f09f0a] rounded-full border-2 border-white" }))
                        })
                    )
                );
            };

            const clientesFiltrados = (clientes || []).filter(c => 
                c.cliente_nome && c.cliente_nome.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (!isAuth) return h(LoginPortal, { onLogin: () => setIsAuth(true) });

            const stats = {
                total: clientesFiltrados.length,
                financeiro: clientesFiltrados.reduce((acc, c) => acc + Number(c.valor || 0), 0)
            };

            return h("div", { className: "min-h-screen flex flex-col pb-20 relative" },
                h("header", { className: "bg-white border-b border-gray-100 p-6 sticky top-0 z-20 shadow-sm" },
                    h("div", { className: "max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6" },
                        h("div", { className: "flex flex-col md:flex-row items-center gap-6" },
                            h("h1", { className: "text-2xl font-black italic uppercase tracking-tighter text-black" }, "PORTAL ", h("span", { className: "text-[#f09f0a]" }, "ADMIN")),
                            h("div", { className: "flex flex-wrap bg-gray-100 p-1 rounded-xl border border-gray-200 gap-1" },
                                h("button", { 
                                    onClick: () => setCurrentTab("agendamentos"), 
                                    className: `px-4 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all ${currentTab === "agendamentos" ? "bg-white text-black shadow-sm" : "text-gray-400 hover:text-black"}` 
                                }, "Agendamentos"),
                                h("button", { 
                                    onClick: () => setCurrentTab("manicure"), 
                                    className: `px-4 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all ${currentTab === "manicure" ? "bg-white text-black shadow-sm" : "text-gray-400 hover:text-black"}` 
                                }, "Painel Manicure"),
                                h("button", { 
                                    onClick: () => setCurrentTab("financeiro"), 
                                    className: `px-4 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all ${currentTab === "financeiro" ? "bg-white text-black shadow-sm" : "text-gray-400 hover:text-black"}` 
                                }, "Fluxo Estratégico"),
                                h("button", { 
                                    onClick: () => setCurrentTab("agenda_config"), 
                                    className: `px-4 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all ${currentTab === "agenda_config" ? "bg-white text-black shadow-sm" : "text-gray-400 hover:text-black"}` 
                                }, "Configurar Agenda")
                            )
                        ),
                        currentTab === "agendamentos" && h("div", { className: "flex flex-wrap justify-center gap-4" },
                            h("div", { className: "relative flex items-center" },
                                h("input", { 
                                    type: "text", 
                                    placeholder: "PESQUISAR CLIENTE...", 
                                    className: "bg-gray-100 px-4 py-3 rounded-2xl text-[10px] font-black outline-none uppercase w-64 focus:border-[#f09f0a] border border-transparent",
                                    value: searchTerm,
                                    onChange: (e) => setSearchTerm(e.target.value)
                                })

                        h("button", { onClick: () => setIsModalOpen(false), className: "absolute top-6 right-6 p-2 text-gray-400 hover:text-black hover:bg-gray-100 rounded-full transition-all" }, "✕"),
                        h("div", { className: "p-8 space-y-6" },
                            h("h2", { className: "text-2xl font-black italic uppercase tracking-tighter text-black" }, "Novo ", h("span", { className: "text-[#f09f0a]" }, "Cadastro")),
                            h("div", { className: "space-y-4" },
                                h("div", { className: "grid grid-cols-2 gap-3" },
                                    h("input", { type: "text", className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#f09f0a]", placeholder: "NOME DO CLIENTE", value: novoAgendamento.nome, onChange: (e) => setNovoAgendamento({...novoAgendamento, nome: e.target.value.toUpperCase()}) }),
                                    h("input", { type: "tel", className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#f09f0a]", placeholder: "WHATSAPP", value: novoAgendamento.telefone, onChange: (e) => setNovoAgendamento({...novoAgendamento, telefone: e.target.value}) })
                                ),
                                h("div", { className: "grid grid-cols-2 gap-3" },
                                    h("input", { type: "date", className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl text-[10px] font-black cursor-pointer", value: novoAgendamento.data, onChange: (e) => setNovoAgendamento({...novoAgendamento, data: e.target.value}) }),
                                    h("input", { type: "time", className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl text-[10px] font-black cursor-pointer", value: novoAgendamento.horario, onChange: (e) => setNovoAgendamento({...novoAgendamento, horario: e.target.value}) })
                                ),
                                h("div", { className: "space-y-1" },
                                    h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Aniversário (Opcional)"),
                                    h("input", { 
                                        type: "text", 
                                        maxLength: 5,
                                        className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#f09f0a]", 
                                        placeholder: "EX: 25/08", 
                                        value: novoAgendamento.aniversario, 
                                        onChange: (e) => setNovoAgendamento({...novoAgendamento, aniversario: aplicarMascaraAniversario(e.target.value)}) 
                                    })
                                ),
                                h("div", { className: "space-y-2" },
                                    h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Procedimentos"),
                                    h("div", { className: "grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1 custom-scroll" },
                                        (servicosDb || []).map(s => h("button", { 
                                            key: s.nome, 
                                            onClick: () => toggleServico(s), 
                                            className: `p-4 rounded-xl text-[9px] font-black uppercase text-left border flex justify-between items-center ${servicosSelecionados.some(sel => sel.nome === s.nome) ? 'bg-orange-50 border-[#f09f0a] text-[#f09f0a]' : 'bg-gray-50 border-gray-100 text-gray-400'}` 
                                        }, s.nome, servicosSelecionados.some(sel => sel.nome === s.nome) && "✓"))
                                    )
                                ),
                                h("div", { className: "p-4 rounded-2xl flex justify-between items-center bg-black text-white" },
                                    h("span", { className: "text-[9px] font-black uppercase text-[#f09f0a]" }, "Total:"),
                                    h("span", { className: "font-black italic text-xl" }, `R$ ${totalValorNovo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`)
                                ),
                                h("button", { onClick: handleAddAgendamento, className: "w-full py-5 gold-bg text-black font-black uppercase text-[11px] tracking-[0.2em] rounded-2xl shadow-xl cursor-pointer" }, "Confirmar")
                            )
                        )
                    )
                ),

                isFinanceiroModalOpen && h("div", { className: "fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/70 backdrop-blur-md" },
                    h("div", { className: "bg-white w-full max-w-md rounded-[45px] p-12 shadow-2xl relative" },
                        h("button", { onClick: () => setIsFinanceiroModalOpen(false), className: "absolute top-10 right-10 text-zinc-300 hover:text-black font-black" }, "✕"),
                        h("h3", { className: "text-sm font-black uppercase tracking-[0.4em] mb-10 text-zinc-800" }, "Lançamento Financeiro"),
                        h("form", { onSubmit: handleSaveFinanceiro, className: "space-y-6" },
                            h("input", { required: true, placeholder: "DESCRIÇÃO", className: "w-full bg-zinc-50 rounded-2xl px-6 py-4 text-xs font-bold outline-none uppercase", value: formDataFinanceiro.item, onChange: e => setFormDataFinanceiro({...formDataFinanceiro, item: e.target.value}) }),
                            h("div", { className: "grid grid-cols-2 gap-4" },
                                h("input", { required: true, placeholder: "VALOR R$", className: "w-full bg-zinc-50 rounded-2xl px-6 py-4 text-xs font-black outline-none", value: formDataFinanceiro.valor, onChange: e => setFormDataFinanceiro({...formDataFinanceiro, valor: e.target.value.replace(/[^0-9,.]/g, "")}) }),
                                h("select", { className: "w-full bg-zinc-50 rounded-2xl px-6 py-4 text-[10px] font-black outline-none uppercase cursor-pointer", value: formDataFinanceiro.tipo, onChange: e => setFormDataFinanceiro({...formDataFinanceiro, tipo: e.target.value}) },
                                    h("option", { value: "entrada" }, "Entrada (+)"),
                                    h("option", { value: "saida" }, "Saída (-)")
                                )
                            ),
                            h("input", { required: true, placeholder: "CATEGORIA", className: "w-full bg-zinc-50 rounded-2xl px-6 py-4 text-xs font-bold outline-none uppercase", value: formDataFinanceiro.categoria, onChange: e => setFormDataFinanceiro({...formDataFinanceiro, categoria: e.target.value}) }),
                            h("button", { type: "submit", className: "w-full bg-black text-white py-6 rounded-full font-black text-[10px] uppercase tracking-[0.4em] shadow-2xl hover:bg-[#f09f0a] transition-all cursor-pointer" }, "Confirmar Lançamento")
                        )
                    )
                ),

                isConfigModalOpen && h("div", { className: "fixed inset-0 bg-black/40 backdrop-blur-[2px] z-[100] flex items-center justify-center p-4" },
                    h("div", { className: "bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-zinc-50 space-y-6 max-h-[90vh] overflow-y-auto custom-scroll" },
                        h("div", { className: "flex justify-between items-center border-b pb-4" },
                            h("div", { className: "flex flex-col" },
                                h("h2", { className: "font-black text-zinc-900 uppercase text-[10px] tracking-[0.2em]" }, "Gestão do Dia & Horários"),
                                h("span", { className: "text-zinc-400 font-bold text-xs" }, selectedDateISO)
                            ),
                            h("button", { onClick: () => setIsConfigModalOpen(false), className: "text-zinc-300 hover:text-zinc-900 transition-colors font-black" }, "✕")
                        ),
                        
                        h("div", { className: "bg-zinc-50 p-4 rounded-2xl border border-zinc-100 flex items-center justify-between" },
                            h("div", { className: "flex flex-col" },
                                h("span", { className: "text-[10px] font-black uppercase text-zinc-900" }, "Estado do Dia Inteiro"),
                                h("span", { className: "text-[9px] text-zinc-500" }, bloqueios.includes(selectedDateISO) ? "O dia está bloqueado" : "O dia está aberto")
                            ),
                            h("button", {
                                onClick: toggleBloqueioDiaModal,
                                className: `px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all cursor-pointer ${bloqueios.includes(selectedDateISO) ? 'bg-red-500 text-white shadow' : 'bg-zinc-200 text-zinc-700'}`
                            }, bloqueios.includes(selectedDateISO) ? "Desbloquear Dia" : "Bloquear Dia Inteiro")
                        ),

                        h("div", { className: "space-y-4" },
                            h("p", { className: "text-[10px] font-black text-zinc-400 uppercase tracking-widest" }, "Ajustar Horário de Funcionamento do Dia"),
                            h("div", { className: "grid grid-cols-2 gap-3" },
                                h("div", { className: "flex flex-col gap-1" },
                                    h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, "Início"),
                                    h("input", { type: "time", value: tempInicio, onChange: e => setTempInicio(e.target.value), className: "bg-zinc-50 border border-zinc-100 p-3 rounded-xl font-bold text-zinc-900 outline-none focus:border-[#f09f0a] cursor-pointer" })
                                ),
                                h("div", { className: "flex flex-col gap-1" },
                                    h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, "Fim"),
                                    h("input", { type: "time", value: tempFim, onChange: e => setTempFim(e.target.value), className: "bg-zinc-50 border border-zinc-100 p-3 rounded-xl font-bold text-zinc-900 outline-none focus:border-[#f09f0a] cursor-pointer" })
                                )
                            ),
                            h("button", { 
                                onClick: salvarExcecao, 
                                disabled: loading,
                                className: "w-full bg-zinc-900 text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-[0.1em] hover:bg-[#f09f0a] hover:text-black transition-all cursor-pointer"
                            }, 'Salvar Expediente do Dia')
                        ),

                        h("div", { className: "space-y-3 pt-4 border-t border-zinc-100" },
                            h("div", { className: "flex flex-col" },
                                h("span", { className: "text-[10px] font-black text-zinc-900 uppercase tracking-widest" }, "Inativar Horários Específicos"),
                                h("span", { className: "text-[9px] text-zinc-400 font-medium" }, "Clique num horário para deixá-lo vermelho/bloqueado")
                            ),
                            h("div", { className: "grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-1 custom-scroll bg-zinc-50 rounded-2xl border border-zinc-100" },
                                gerarSlotsDoDia().map(slot => {
                                    const inativados = horariosInativadosMap[selectedDateISO] || [];
                                    const isInativado = inativados.includes(slot);
                                    return h("button", {
                                        key: slot,
                                        onClick: () => toggleHorarioPontual(slot),
                                        className: `p-3 rounded-xl text-xs font-black transition-all flex flex-col items-center justify-center border cursor-pointer ${
                                            isInativado 
                                                ? 'bg-red-600 text-white border-red-700 line-through shadow-md scale-95' 
                                                : 'bg-white text-zinc-800 border-zinc-200 hover:border-[#f09f0a]'
                                        }`
                                    }, 
                                        slot,
                                        h("span", { className: "text-[8px] uppercase tracking-tighter mt-0.5 font-bold" }, isInativado ? 'Bloqueado' : 'Disponível')
                                    );
                                })
                            )
                        ),

                        h("button", { 
                            onClick: () => setIsConfigModalOpen(false),
                            className: "w-full bg-[#f09f0a] text-black font-black py-4 rounded-2xl uppercase text-[11px] tracking-[0.2em] hover:bg-zinc-900 hover:text-white transition-all shadow-xl cursor-pointer"
                        }, "Concluir")
                    )
                ),

                h("footer", { className: "fixed bottom-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-100 p-4 text-center z-10" },
                    h("p", { className: "text-[10px] font-bold text-gray-400 uppercase tracking-[0.4em]" }, "© 2026 Rivi Silva Style")
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(Dashboard));
    </script>
</body>
</html>
