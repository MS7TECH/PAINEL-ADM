<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Rivi</title>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8f8f8; }
        .gold-bg { background: linear-gradient(135deg, #bf953f 0%, #a67c00 100%); }
        .gold-text { color: #bf953f; }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        const h = React.createElement;

        // Configuração do Supabase (mesma credencial da manicure)
        const SUPABASE_URL = 'https://rahubkowehwtvditbhlx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_wKbs4gYVURdIR6Cafm8qFA_tUZZTIKo';
        const dbRivi = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [view, setView] = useState('manicure'); // 'manicure' ou outras abas do Rivi
            
            // Estados para o Relatório Manicure
            const [registrosManicure, setRegistrosManicure] = useState([]);
            const [dataInicio, setDataInicio] = useState('');
            const [dataFim, setDataFim] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (isLoggedIn && dbRivi) {
                    carregarRelatorioManicure();
                }
            }, [isLoggedIn]);

            const carregarRelatorioManicure = async () => {
                if (!dbRivi) return;
                setLoading(true);
                try {
                    let query = dbRivi
                        .from('registros_manicure')
                        .select('*')
                        .order('data_atendimento', { ascending: false });

                    const { data, error } = await query;

                    if (error) {
                        console.error('Erro ao buscar relatórios:', error);
                    } else {
                        setRegistrosManicure(data || []);
                    }
                } catch (e) {
                    console.error('Erro inesperado:', e);
                } finally {
                    setLoading(false);
                }
            };

            // Tela de Login do Painel Rivi
            if (!isLoggedIn) {
                return h("div", { className: "min-h-screen flex items-center justify-center p-4" },
                    h("div", { className: "bg-white p-8 rounded-[2rem] shadow-xl w-full max-w-sm text-center" },
                        h("h1", { className: "text-2xl font-black mb-6" }, "Painel ", h("span", { className: "gold-text" }, "Rivi")),
                        h("input", { 
                            type: "password", 
                            placeholder: "Senha de Acesso", 
                            value: password,
                            onChange: (e) => setPassword(e.target.value), 
                            className: "w-full bg-zinc-50 p-4 rounded-xl mb-4 border border-zinc-200 text-center" 
                        }),
                        h("button", { 
                            onClick: () => password === '1234' ? setIsLoggedIn(true) : alert('Senha incorreta!'), 
                            className: "w-full gold-bg text-white p-4 rounded-xl font-black cursor-pointer" 
                        }, "Entrar")
                    )
                );
            }

            // Filtragem por período (Data Inicial e Data Final)
            const registrosFiltrados = registrosManicure.filter(item => {
                if (!item.data_atendimento) return true;
                if (dataInicio && item.data_atendimento < dataInicio) return false;
                if (dataFim && item.data_atendimento > dataFim) return false;
                return true;
            });

            // Cálculo do valor total do período selecionado
            const valorTotalPeriodo = registrosFiltrados.reduce((acc, item) => acc + Number(item.valor || 0), 0);

            return h("div", { className: "min-h-screen p-4 max-w-2xl mx-auto" },
                // Menu de navegação do Painel Rivi
                h("div", { className: "flex gap-2 mb-6" },
                    h("button", { 
                        onClick: () => setView('manicure'), 
                        className: `flex-1 p-3 rounded-xl font-bold transition-all ${view === 'manicure' ? 'gold-bg text-white' : 'bg-white shadow-sm'}` 
                    }, "Relatório Manicure")
                ),

                // Conteúdo da Aba Relatório Manicure
                view === 'manicure' && h("div", { className: "bg-white p-6 md:p-8 rounded-[2rem] shadow-xl space-y-6" },
                    h("div", { className: "flex flex-col md:flex-row justify-between items-start md:items-center gap-4" },
                        h("h1", { className: "text-2xl font-black" }, "Relatório de ", h("span", { className: "gold-text" }, "Manicure")),
                        h("button", { 
                            onClick: carregarRelatorioManicure, 
                            className: "text-xs bg-zinc-100 hover:bg-zinc-200 font-bold px-4 py-2 rounded-lg transition-all" 
                        }, "Atualizar Dados")
                    ),

                    // Filtros de Período
                    h("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4 bg-zinc-50 p-4 rounded-2xl border border-zinc-100" },
                        h("div", {},
                            h("label", { className: "block text-xs font-bold text-zinc-500 mb-1" }, "Data Inicial"),
                            h("input", { 
                                type: "date", 
                                value: dataInicio, 
                                onChange: (e) => setDataInicio(e.target.value), 
                                className: "w-full bg-white p-3 rounded-xl border border-zinc-200 text-sm" 
                            })
                        ),
                        h("div", {},
                            h("label", { className: "block text-xs font-bold text-zinc-500 mb-1" }, "Data Final"),
                            h("input", { 
                                type: "date", 
                                value: dataFim, 
                                onChange: (e) => setDataFim(e.target.value), 
                                className: "w-full bg-white p-3 rounded-xl border border-zinc-200 text-sm" 
                            })
                        )
                    ),

                    // Card de Valor Total por Período
                    h("div", { className: "gold-bg text-white p-6 rounded-2xl flex justify-between items-center shadow-md" },
                        h("div", {},
                            h("p", { className: "text-xs uppercase font-bold tracking-wider opacity-90" }, "Total no Período"),
                            h("p", { className: "text-3xl font-black mt-1" }, `R$ ${valorTotalPeriodo.toFixed(2)}`)
                        ),
                        h("div", { className: "text-right" },
                            h("p", { className: "text-xs opacity-90 font-medium" }, `${registrosFiltrados.length} atendimento(s)`)
                        )
                    ),

                    // Lista de Lançamentos
                    loading ? h("p", { className: "text-center text-zinc-400 py-8" }, "Carregando lançamentos...") :
                    registrosFiltrados.length === 0 ? h("p", { className: "text-center text-zinc-400 py-8" }, "Nenhum atendimento encontrado para o período selecionado.") :
                    h("div", { className: "space-y-3 max-h-[50vh] overflow-y-auto pr-1" },
                        registrosFiltrados.map(item => 
                            h("div", { key: item.id || item.criado_em, className: "p-4 bg-zinc-50 rounded-xl border border-zinc-100 flex justify-between items-center" },
                                h("div", {},
                                    h("p", { className: "font-bold text-zinc-800" }, item.cliente),
                                    h("p", { className: "text-xs text-zinc-500 mt-0.5" }, `${item.data_atendimento} • ${item.servico}`)
                                ),
                                h("div", { className: "text-right" },
                                    h("p", { className: "font-black gold-text text-base" }, `R$ ${Number(item.valor).toFixed(2)}`)
                                )
                            )
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
