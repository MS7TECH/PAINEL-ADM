                if (!selectedDateISO) return [];
                const confAtiva = excecoes[selectedDateISO] || config;
                const [hIni, mIni] = (confAtiva.inicio || '09:00').split(':').map(Number);
                const [hFim, mFim] = (confAtiva.fim || '18:00').split(':').map(Number);
                
                let minutosAtuais = hIni * 60 + mIni;
                const minutosFim = hFim * 60 + mFim;
                const intervalo = Number(config.intervalo) || 40;

                const slots = [];
                while (minutosAtuais < minutosFim) {
                    const hh = String(Math.floor(minutosAtuais / 60)).padStart(2, '0');
                    const mm = String(minutosAtuais % 60).padStart(2, '0');
                    slots.push(`${hh}:${mm}`);
                    minutosAtuais += intervalo;

                const customSlots = horariosInativadosMap[selectedDateISO] || [];
                const extras = horariosExtrasMap[selectedDateISO] || [];
                const combined = [...new Set([...slots, ...extras])];
                
                combined.sort((a, b) => {
                    const [ha, ma] = a.split(':').map(Number);
                    const [hb, mb] = b.split(':').map(Number);
                    return (ha * 60 + ma) - (hb * 60 + mb);

                            h("div", { className: "grid grid-cols-2 gap-3" },
                                h("div", { className: "flex flex-col gap-1" },
                                    h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, "Início"),
                                    h("input", { type: "time", value: tempInicio, onChange: e => setTempInicio(e.target.value), className: "bg-zinc-50 border border-zinc-100 p-3 rounded-xl font-bold text-zinc-900 outline-none focus:border-[#bf953f] cursor-pointer" })
                                ),
                                h("div", { className: "flex flex-col gap-1" },
                                    h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, "Fim"),
                                    h("input", { type: "time", value: tempFim, onChange: e => setTempFim(e.target.value), className: "bg-zinc-50 border border-zinc-100 p-3 rounded-xl font-bold text-zinc-900 outline-none focus:border-[#bf953f] cursor-pointer" })
                                )
                            ),
                            h("button", { 
                                onClick: salvarExcecao, 
                                disabled: loading,
                                className: "w-full bg-zinc-900 text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-[0.1em] hover:bg-[#bf953f] hover:text-black transition-all cursor-pointer"
                            }, 'Salvar Expediente do Dia')
                        ),

                        h("div", { className: "space-y-3 pt-4 border-t border-zinc-100" },
                            h("div", { className: "flex flex-col" },
                                h("span", { className: "text-[10px] font-black text-zinc-900 uppercase tracking-widest" }, "Gerenciar Horários Específicos"),
                                h("span", { className: "text-[9px] text-zinc-400 font-medium" }, "Inative ou edite os horários individuais do dia")
                            ),
                            h("div", { className: "grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-1 custom-scroll bg-zinc-50 rounded-2xl border border-zinc-100" },
                                gerarSlotsDoDia().map(slot => {
                                    const inativados = horariosInativadosMap[selectedDateISO] || [];
                                    const isInativado = inativados.includes(slot);
                                    const estaEditando = horarioEditando === slot;

                                    if (estaEditando) {
                                        return h("div", { key: slot, className: "p-2 bg-white border border-[#bf953f] rounded-xl flex flex-col gap-1 items-center justify-center col-span-3 shadow-md" },
                                            h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, `Editar ${slot}`),
                                            h("div", { className: "flex gap-2 w-full" },
                                                h("input", { 
                                                    type: "time", 
                                                    value: novoValorHorario, 
                                                    onChange: (e) => setNovoValorHorario(e.target.value),
                                                    className: "bg-zinc-50 border border-zinc-200 p-1.5 rounded-lg text-xs font-bold outline-none flex-1 text-center" 
                                                }),
                                                h("button", {
                                                    onClick: async () => {
                                                        if (!novoValorHorario) return alert("Insira um horário válido.");
                                                        
                                                        await _supabase.from('horarios_bloqueados_pontuais')
                                                            .insert([{ data: selectedDateISO, horario: slot }]);
                                                        
                                                        const { error } = await _supabase.from('horarios_extras')
                                                            .insert([{ data: selectedDateISO, horario: novoValorHorario }]);

                                                        if (error) {
                                                            console.error(error);
                                                            return alert("Erro ao salvar horário no banco de dados.");
                                                        }

                                                        setHorariosInativadosMap(prev => ({
                                                            ...prev,
                                                            [selectedDateISO]: [...(prev[selectedDateISO] || []), slot]
                                                        }));

                                                        setHorariosExtrasMap(prev => ({
                                                            ...prev,
                                                            [selectedDateISO]: [...(prev[selectedDateISO] || []), novoValorHorario]
                                                        }));

                                                        setHorarioEditando(null);
                                                        setNovoValorHorario("");
                                                        alert("Horário editado e salvo com sucesso!");
                                                    },
                                                    className: "bg-[#bf953f] text-black px-3 py-1 rounded-lg text-xs font-black uppercase cursor-pointer"
                                                }, "Salvar"),
                                                h("button", {
                                                    onClick: () => setHorarioEditando(null),
                                                    className: "bg-zinc-200 text-zinc-700 px-2 py-1 rounded-lg text-xs font-bold cursor-pointer"
                                                }, "✕")
                                            )
                                        );
                                    }

                                    return h("div", {
                                        key: slot,
                                        className: `p-2.5 rounded-xl text-xs font-black transition-all flex flex-col items-center justify-center border relative group ${
                                            isInativado ? 'bg-red-600 text-white border-red-700 line-through shadow-sm' : 'bg-white text-zinc-800 border-zinc-200 hover:border-[#bf953f]'
                                        }`
                                    },
                                        h("span", { 
                                            onClick: () => toggleHorarioPontual(slot),
                                            className: "cursor-pointer w-full text-center"
                                        }, slot),
                                        h("div", { className: "flex gap-2 mt-1" },
                                            h("button", {
                                                onClick: () => toggleHorarioPontual(slot),
                                                className: "text-[8px] uppercase tracking-tighter font-bold cursor-pointer underline"
                                            }, isInativado ? 'Ativar' : 'Inativar'),
                                            h("button", {
                                                onClick: () => {
                                                    setHorarioEditando(slot);
                                                    setNovoValorHorario(slot);
                                                },
                                                className: "text-[8px] uppercase tracking-tighter font-bold cursor-pointer text-[#bf953f]"
                                            }, "Editar")
                                        )
                                    );
                                })
                            )
                        ),

                        h("button", { 
                            onClick: () => setIsConfigModalOpen(false),
                            className: "w-full bg-[#bf953f] text-black font-black py-4 rounded-2xl uppercase text-[11px] tracking-[0.2em] hover:bg-zinc-900 hover:text-white transition-all shadow-xl cursor-pointer"
                        }, "Concluir")
                    )
                ),

                isServicoModalOpen && h("div", { className: "fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" },
                    h("div", { className: "bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl border-2 border-[#bf953f] relative" },
                        h("button", { 
                            onClick: () => { setIsServicoModalOpen(false); setServicoEditando(null); }, 
                            className: "absolute top-6 right-6 p-2 text-gray-400 hover:text-black hover:bg-gray-100 rounded-full transition-all cursor-pointer font-bold" 
                        }, "✕"),
                        h("div", { className: "p-8 space-y-6" },
                            h("h2", { className: "text-2xl font-black italic uppercase tracking-tighter text-black" }, 
                                servicoEditando ? "Editar " : "Novo ", 
                                h("span", { className: "text-[#bf953f]" }, "Serviço")
                            ),
                            h("form", { onSubmit: handleSaveServico, className: "space-y-4" },
                                h("div", { className: "space-y-1" },
                                    h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Nome do Serviço"),
                                    h("input", { 
                                        type: "text", 
                                        required: true,
                                        className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                        placeholder: "EX: ESMALTAÇÃO EM GEL", 
                                        value: formServico.nome, 
                                        onChange: (e) => setFormServico({...formServico, nome: e.target.value.toUpperCase()}) 
                                    })
                                ),
                                h("div", { className: "grid grid-cols-2 gap-3" },
                                    h("div", { className: "space-y-1" },
                                        h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Preço (R$)"),
                                        h("input", { 
                                            type: "text", 
                                            required: true,
                                            className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                            placeholder: "0,00", 
                                            value: formServico.preco, 
                                            onChange: (e) => setFormServico({...formServico, preco: e.target.value.replace(/[^0-9,.]/g, "")}) 
                                        })
                                    ),
                                    h("div", { className: "space-y-1" },
                                        h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Duração (min)"),
                                        h("input", { 
                                            type: "number", 
                                            min: "0",
                                            className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                            placeholder: "40", 
                                            value: formServico.duracao, 
                                            onChange: (e) => setFormServico({...formServico, duracao: e.target.value}) 
                                        })
                                    )
                                ),
                                h("button", { 
                                    type: "submit", 
                                    className: "w-full py-5 gold-bg text-black font-black uppercase text-[11px] tracking-[0.2em] rounded-2xl shadow-xl cursor-pointer" 
                                }, servicoEditando ? "Salvar Alterações" : "Cadastrar Serviço")
                            )
                        )
                    )
                ),

                h("footer", { className: "fixed bottom-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-100 p-4 text-center z-10" },
                    h("p", { className: "text-[10px] font-bold text-gray-400 uppercase tracking-[0.4em]" }, "© 2026 Rivi Silva Style")
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(Dashboard));
    </script>
</body>
</html>
